name = "dodgers-win-alerts"
main = "src/index.js"
compatibility_date = "2026-09-18"

# Cloudflare Cron Triggers always run in UTC (no timezone support), so these
# are tuned for Pacific *Daylight* Time (UTC-7), which covers virtually the
# entire MLB season (regular season + postseason run April-ish through early
# November; DST doesn't end until early November). During the off-season
# (Pacific Standard Time, UTC-8) these run an hour later local time than the
# comment below states — harmless, since there are no games to find then.
#
# - "*/15 20-23 * * *" + "*/15 0-6 * * *": together, check every 15 minutes
#   from ~1:00 PM to ~11:45 PM Pacific — the realistic window for a Dodgers
#   game to be in progress or just wrapping up. No point checking overnight
#   or early morning when nothing is being played.
# - "0 15 * * *": once-daily morning recap at 8:00 AM Pacific. Must match
#   MORNING_CRON in src/index.js exactly.
[triggers]
crons = [
  "*/15 20-23 * * *",
  "*/15 0-6 * * *",
  "0 15 * * *",
]

[vars]
MLB_TEAM_ID = "119"
HOME_VENUE_MATCH = "dodger stadium"
NTFY_TOPIC = "ddbb-dodgers-panda-win"
# Self-hosted ntfy instance (Google Cloud Run, free tier) — the public
# ntfy.sh server's free-tier rate limiting is IP-based and shared across
# every Cloudflare Worker's egress IPs, which routinely exhausted our daily
# quota from unrelated traffic. Self-hosting avoids that entirely. See
# https://github.com/binwiederhier/ntfy/issues/1963 for the writeup.
NTFY_SERVER = "https://dodgers-ntfy-646055455476.us-west1.run.app"

# ADMIN_SECRET and NTFY_TOKEN are secrets, not vars — set them with:
#   npx wrangler secret put ADMIN_SECRET
#   npx wrangler secret put NTFY_TOKEN   (not needed for the self-hosted
#     server above, which has no auth by default — only relevant if you
#     switch back to the public ntfy.sh)

[[kv_namespaces]]
binding = "DODGERS_KV"
id = "bafb15bc26b5467bad335dbc66550b32"

[observability.logs]
enabled = true
invocation_logs = true
persist = true
